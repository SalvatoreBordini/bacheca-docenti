<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacheca Digitale Scolastica</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Header */
        header { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #3b82f6; }
        .school-title { font-size: 2rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .live-clock { font-size: 2.2rem; font-weight: 700; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 8px; }

        /* Main Layout */
        .main-container { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }
        
        /* Left Column: Schedule */
        .schedule-section { flex: 1.2; background: #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; border: 1px solid #334155; }
        .section-title { font-size: 1.5rem; color: #3b82f6; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .schedule-grid { width: 100%; border-collapse: collapse; text-align: left; font-size: 1.2rem; }
        .schedule-grid th, .schedule-grid td { padding: 14px; border-bottom: 1px solid #334155; }
        .schedule-grid th { background-color: #0f172a; color: #94a3b8; }
        .variation { color: #f43f5e; font-weight: bold; background: rgba(244,63,94,0.1); padding: 2px 6px; border-radius: 4px; }

        /* Right Column: Notices */
        .notices-section { flex: 0.8; background: #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; border: 1px solid #334155; }
        .notice-card { background: #0f172a; border-left: 5px solid #eab308; padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; animation: fadeIn 0.5s ease-in-out; }
        .notice-card h3 { color: #eab308; margin-bottom: 5px; font-size: 1.3rem; }
        .notice-card p { color: #cbd5e1; font-size: 1.1rem; }

        /* Bottom Ticker */
        .ticker-wrap { background: #eab308; color: #0f172a; padding: 10px 0; overflow: hidden; font-weight: bold; font-size: 1.3rem; }
        .ticker { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker 25s linear infinite; }
        
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="school-title">🏫 ISTITUTO SUPERIORE GENERATO</div>
        <div class="live-clock" id="clock">00:00:00</div>
    </header>

    <div class="main-container">
        <!-- Orario del Giorno -->
        <div class="schedule-section">
            <div class="section-title">
                <span>📅 Orario e Variazioni del Giorno</span>
                <span style="font-size: 1rem; color: #94a3b8;" id="current-date">--/--/----</span>
            </div>
            <table class="schedule-grid">
                <thead>
                    <tr>
                        <th>Classe</th>
                        <th>Ora</th>
                        <th>Materia / Aula</th>
                        <th>Note / Sostituzioni</th>
                    </tr>
                </thead>
                <tbody id="schedule-tbody">
                    <!-- Caricato dinamicamente via JS -->
                </tbody>
            </table>
        </div>

        <!-- Avvisi in Evidenza -->
        <div class="notices-section">
            <div class="section-title">📢 Avvisi Importanti</div>
            <div id="notices-container">
                <!-- Caricato dinamicamente via JS -->
            </div>
        </div>
    </div>

    <!-- Ticker Scorrevole Inferiore -->
    <div class="ticker-wrap">
        <div class="ticker" id="ticker-content">
            Caricamento eventi in corso... • Benvenuti a scuola! • Controllare sempre le variazioni d'orario.
        </div>
    </div>

    <script>
        // Orologio in tempo reale
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('it-IT');
            document.getElementById('current-date').innerText = now.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Caricamento Dati dai file JSON locali (gestiti su GitHub)
        async function loadBachecaData() {
            try {
                // Carica Orario
                const resOrario = await fetch('orario.json');
                const orari = await resOrario.json();
                const tbody = document.getElementById('schedule-tbody');
                tbody.innerHTML = '';
                orari.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${r.classe}</strong></td>
                        <td>${r.ora}° ora</td>
                        <td>${r.materia}</td>
                        <td><span class="${r.variazione ? 'variation' : ''}">${r.note}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                // Carica Avvisi
                const resAvvisi = await fetch('avvisi.json');
                const avvisi = await resAvvisi.json();
                const noticesContainer = document.getElementById('notices-container');
                noticesContainer.innerHTML = '';
                let tickerText = "";
                
                avvisi.forEach(a => {
                    // Popola carte avvisi
                    const card = document.createElement('div');
                    card.className = 'notice-card';
                    card.innerHTML = `<h3>${a.titolo}</h3><p>${a.testo}</p>`;
                    noticesContainer.appendChild(card);
                    
                    // Popola ticker string
                    tickerText += ` 🔥 ${a.titolo}: ${a.testo} ••• `;
                });
                
                if(tickerText) {
                    document.getElementById('ticker-content').innerText = tickerText;
                }

            } catch (error) {
                console.error("Errore nel caricamento dei dati della bacheca:", error);
            }
        }

        // Ricarica i dati automaticamente ogni 5 minuti senza riavviare la pagina
        loadBachecaData();
        setInterval(loadBachecaData, 300000);
    </script>
</body>
</html>
